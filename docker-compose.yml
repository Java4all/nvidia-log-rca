version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Log-RCA  |  Docker Compose
#
# Services:
#   ollama       – Ollama LLM + embedding server (GPU)
#   ollama-init  – one-shot model puller
#   api          – FastAPI (wraps real NVIDIA bat_ai pipeline)
#   ui           – Chainlit chat interface
#   nginx        – reverse proxy (port 80)
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  OLLAMA_BASE_URL: http://ollama:11434
  LLM_MODEL:       ${LLM_MODEL:-mistral:7b-instruct-q4_K_M}
  EMBED_MODEL:     ${EMBED_MODEL:-nomic-embed-text}
  RERANKER_MODEL:  ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  MAX_LOG_BYTES:   ${MAX_LOG_BYTES:-52428800}

services:

  ollama:
    image: ollama/ollama:latest
    container_name: rca-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Official image has no curl; use bundled CLI (hits localhost:11434).
    healthcheck:
      test:         ["CMD", "ollama", "list"]
      interval:     10s
      timeout:      5s
      retries:      18
      start_period: 30s

  ollama-init:
    image: curlimages/curl:latest
    container_name: rca-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL:   ${LLM_MODEL:-mistral:7b-instruct-q4_K_M}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./ollama/pull_models.sh:/pull_models.sh:ro
    entrypoint: ["/bin/sh", "/pull_models.sh"]
    restart: "no"

  api:
    build:
      context:    ./app
      dockerfile: Dockerfile
    container_name: rca-api
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      # Cache HuggingFace reranker model between restarts
      - hf_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy

  ui:
    build:
      context:    ./app/ui
      dockerfile: Dockerfile
    container_name: rca-ui
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: rca-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
      - api

volumes:
  ollama_models:
  hf_cache:
