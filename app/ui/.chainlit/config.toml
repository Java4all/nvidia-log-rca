[project]
enable_telemetry = false

[UI]
name = "Log-RCA"
description = "Log-RCA — build log root cause analysis for engineering teams"
default_collapse_content = true
github = ""
custom_css = "/public/theme.css"
custom_font = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[UI.theme]
default = "dark"
layout = "wide"
font_family = "Inter, system-ui, -apple-system, Segoe UI, sans-serif"

[UI.theme.light]
background = "#F4F6F9"
paper = "#FFFFFF"

[UI.theme.light.primary]
main = "#1e4976"
dark = "#143659"
light = "#e4ecf4"

[UI.theme.light.text]
primary = "#1a202c"
secondary = "#4a5568"

[UI.theme.dark]
background = "#0f1419"
paper = "#1a202c"

[UI.theme.dark.primary]
main = "#6ba3d6"
dark = "#4a8bc8"
light = "#1e3a52"

[UI.theme.dark.text]
primary = "#f7fafc"
secondary = "#a0aec0"

[features]
latex = false
unsafe_allow_html = false

[features.spontaneous_file_upload]
enabled = true
accept = ["text/plain", "application/octet-stream", "text/*"]
max_files = 5
max_size_mb = 50

[meta]
generated_by = "1.3.0"
